<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Flexya · Operaciones que fluyen</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6fb">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=flexya">
  <link rel="icon" type="image/webp" sizes="32x32" href="brand/flexya-favicon-32.webp">
  <link rel="icon" type="image/webp" sizes="48x48" href="brand/flexya-favicon-48.webp">
  <style>
    html { background: #f3f6fb; }
    html[data-bs-theme='dark'] { background: #0a1424; }
  </style>
  <script>
    (function () {
      try {
        var guardada = localStorage.getItem('flexya-tema');
        var oscuro = guardada === 'oscuro' || ((!guardada || guardada === 'sistema') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', oscuro ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', oscuro ? '#0a1424' : '#f3f6fb');
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
